plugins {
    id 'java'
    id 'org.springframework.boot' version '3.4.2'
    id 'io.spring.dependency-management' version '1.1.7'
}

group = 'com.example'
version = '0.0.1-SNAPSHOT'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
}

repositories {
    mavenCentral()
}

dependencies {
    implementation 'org.springframework.boot:spring-boot-starter-validation'
    implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
    implementation 'org.springframework.boot:spring-boot-starter-security'
    implementation 'org.springframework.boot:spring-boot-starter-web'
    developmentOnly 'org.springframework.boot:spring-boot-devtools'
    testImplementation 'org.springframework.boot:spring-boot-starter-test'
    testImplementation 'org.springframework.security:spring-security-test'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
    runtimeOnly 'com.mysql:mysql-connector-j'
    runtimeOnly 'org.apache.tomcat.embed:tomcat-embed-jasper:10.1.29' // jsps
    runtimeOnly 'org.glassfish.web:jakarta.servlet.jsp.jstl:3.0.0'    // jsp tags
}

configurations {
    mockitoAgent
}

// Add Mockito as an agent dependency (adjust version as needed)
dependencies {
    mockitoAgent('org.mockito:mockito-core:5.14.0') {
        transitive = false
    }
}

tasks.named('test') {
    useJUnitPlatform()
    // Attach the Mockito agent explicitly at test startup.
    jvmArgs += "-javaagent:${configurations.mockitoAgent.singleFile.absolutePath}"
}

tasks.withType(Test).configureEach {
    useJUnitPlatform()
}
