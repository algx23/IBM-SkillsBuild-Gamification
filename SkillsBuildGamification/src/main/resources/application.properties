spring.application.name=SkillsBuildGamification
spring.mvc.view.prefix= /WEB-INF/views/
spring.mvc.view.suffix= .jsp
spring.datasource.url=jdbc:mysql://localhost:3306/co2124db
spring.datasource.username=co2124
spring.datasource.password=

spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=true
logging.level.org.hibernate.SQL=debug

server.port = 8443
server.ssl.enabled=true
server.ssl.key-store = classpath:keys.jks
server.ssl.key-store-password = 123456
server.ssl.key-password = 123456
server.ssl.key-alias= group32

logging.level.org.springframework.boot.autoconfigure=DEBUG
logging.level.org.springframework.context=DEBUG